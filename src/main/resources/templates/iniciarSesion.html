<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
</head>
<body>
    <h1>Iniciar Sesión</h1>
    <form th:object="${usuario}" th:method="post" action="#"
													th:action="@{/erp/paginaPrincipal}">
        <label for="email">Email:</label>
        <input type="email" th:field="*{email}" placeholder="Ingrese su usuario" required autofocus><br><br>

        <label for="passwordHash">Contraseña:</label>
        <input type="password" th:field="*{passwordHash}" required><br><br>

        <button type="submit">Ingresar</button>
    </form>
    
    <a th:href="@{bienvenido}">Volver al inicio</a>
    
   
</body>
</html>
