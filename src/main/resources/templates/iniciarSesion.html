<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
	<header>
		<p>LOGOTIPO</p>
		<h2>Nombre Empresa</h2>
	</header>

	<main>
		<section class="login-container">
			<div class="login-card">
				<h1>Iniciar Sesión</h1>
				    <form th:object="${usuario}" th:method="post" action="#"
																	th:action="@{/erp/detalleUsuario}">
				        <div class="form-group">
					        <label for="email">Email:</label>
					        <input type="email" th:field="*{email}" placeholder="Ingrese su usuario" required autofocus><br><br>
						</div>
						<div class="form-group">
					        <label for="passwordHash">Contraseña:</label>
					        <input type="password" th:field="*{passwordHash}" required><br><br>
						</div>
				        <button type="submit" class="ingresar">Ingresar</button>
				    </form>
				    
				    <a th:href="@{bienvenido}">Volver al inicio</a>
			</div>
		</section>
	</main>

	<footer>
		<p>&copy; Copyright. Nombre Empresa. Todos los derechos
			reservados.</p>
	</footer>

    
    
   
</body>
</html>
