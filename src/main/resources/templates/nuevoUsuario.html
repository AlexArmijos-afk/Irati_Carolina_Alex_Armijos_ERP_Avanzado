<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="../css/Normal.css">
</head>
<body>
    <div class="cont">
        <h1>Registrar Usuario</h1>
        
        <form action="#" th:action="@{/erp/usuarioRegistrado}" th:object="${usuario}" th:method="post">
        
            <label for="nombre">Nombre:</label>
            <input type="text" th:field="*{nombre}" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" th:field="*{email}" required>

            <label for="passwordHash">Contraseña:</label>
            <input type="password" th:field="*{passwordHash}" required>

            <label for="activo">Activo:</label>
            
            <select th:field="*{activo}">
                <option value="true">Activo</option>
                <option value="false">No activo</option>
            </select>
            
            <label>Roles:</label>
			<div th:each="rol : ${allRoles}">
			    <input type="checkbox"
			           name="rolesIds"
			           th:value="${rol.id}" />
			    <span th:text="${rol.nombre}"></span>
			</div>


            <input class="btn" type="submit" value="Enviar">
            
        </form>
        <a href="paginaPrincipal" class="link">Volver a Página Principal</a>
    </div>
</body>
</html>
